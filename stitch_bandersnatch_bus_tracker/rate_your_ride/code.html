<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-950 fixed top-0 w-full z-50 border-b-2 border-slate-100 dark:border-slate-800 flex items-center justify-between px-5 h-16 w-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400">directions_bus</span>
<h1 class="text-xl font-black tracking-tighter text-blue-600 dark:text-blue-400 font-['Lexend']">Bandersnatch</h1>
</div>
<button class="hover:bg-slate-50 dark:hover:bg-slate-900 active:scale-95 transition-all duration-150 p-sm rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow mt-[64px] mb-[80px] p-container-padding flex flex-col justify-center max-w-lg mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-base">How was the ride?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Help us improve crowding accuracy</p>
</div>
<!-- Feedback Options (Bento Grid Style) -->
<div class="flex flex-col gap-md">
<!-- Empty Option -->
<button class="group w-full bg-surface-container-lowest border-2 border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all duration-150 rounded-xl p-lg flex items-center text-left focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="text-[48px] leading-none mr-lg group-active:scale-90 transition-transform duration-150">🪑</div>
<div class="flex-grow">
<span class="font-headline-md text-headline-md text-on-surface block mb-base">Empty</span>
<span class="font-body-md text-body-md text-outline block">Plenty of seats available</span>
</div>
</button>
<!-- Normal Option -->
<button class="group w-full bg-surface-container-lowest border-2 border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all duration-150 rounded-xl p-lg flex items-center text-left focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="text-[48px] leading-none mr-lg group-active:scale-90 transition-transform duration-150">😐</div>
<div class="flex-grow">
<span class="font-headline-md text-headline-md text-on-surface block mb-base">Normal</span>
<span class="font-body-md text-body-md text-outline block">Standing room mostly</span>
</div>
</button>
<!-- Packed Option -->
<button class="group w-full bg-surface-container-lowest border-2 border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all duration-150 rounded-xl p-lg flex items-center text-left focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="text-[48px] leading-none mr-lg group-active:scale-90 transition-transform duration-150">😤</div>
<div class="flex-grow">
<span class="font-headline-md text-headline-md text-on-surface block mb-base">Packed</span>
<span class="font-body-md text-body-md text-outline block">Hardly any room to stand</span>
</div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-white dark:bg-slate-950 fixed bottom-0 left-0 w-full z-50 rounded-t-none border-t-2 border-slate-100 dark:border-slate-800 h-20 flex justify-around items-center px-4 pb-safe">
<!-- Map Tab -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 py-1 px-3 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform duration-100 font-['Lexend'] text-[12px] font-semibold w-16">
<span class="material-symbols-outlined mb-base">map</span>
<span>Map</span>
</button>
<!-- Schedule Tab -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 py-1 px-3 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform duration-100 font-['Lexend'] text-[12px] font-semibold w-16">
<span class="material-symbols-outlined mb-base">calendar_month</span>

<span class="material-symbols-outlined mb-base" style="font-variation-settings: 'FILL' 1;">thumbs_up_down</span>
<span>Feedback</span>
</button>

<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 py-1 px-3 hover:text-blue-500 dark:hover:text-blue-300 active:scale-90 transition-transform duration-100 font-['Lexend'] text-[12px] font-semibold w-16">
