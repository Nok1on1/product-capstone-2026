<header class="flex justify-between items-center h-14 px-4 w-full sticky top-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
<button class="text-blue-600 dark:text-blue-500 hover:bg-slate-50 dark:hover:bg-slate-800 active:opacity-80 transition-all duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="text-xl font-black text-blue-600 dark:text-blue-500 tracking-tighter">
            Bandersnatch
        </div>
<button class="hover:bg-slate-50 dark:hover:bg-slate-800 active:opacity-80 transition-all duration-200 p-1 rounded-full flex items-center justify-center">
<img alt="Student Profile" class="w-8 h-8 rounded-full border border-slate-200 dark:border-slate-700 object-cover" data-alt="Close up portrait of a young college student outdoors on campus, clear daylight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAs8mF9ePNI11crmnlG04sbpPvzXmOYT56Hh1jg4g11wBtUaUsTaDpF_Lx5Ax6Po_cVInIv8aWFz7xXPafdXmEJhl0K2Mo8hjfV4epMyGTJjTyO_DFaYA3LBuVzTbr5lVmXxuSSFTzH_TwWXaBwU10U8kzvj1TXTrmV6SoAMIYSKMYDNYdsSx8XC0ANcS0arX5UKDGi6rCxl8BvuJrvvzfmg2E-k6UFj5rtwDTOV_5i5Xf2i1nPijj3mlBwAebEb4ZxcBQsTDU59_M"/>

<div class="w-full max-w-md w-full bg-white border border-outline-variant rounded-xl p-lg relative overflow-hidden">

<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Where are you?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your stop to see live bus times.</p>
</div>
<div class="mb-lg space-y-md">
<!-- Bus Stop Selector Dropdown -->
<div class="relative">
<label class="block font-label-bold text-label-bold text-on-surface mb-base" for="stop-selector">Current Stop</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
</div>
<select class="block w-full pl-10 pr-10 py-sm border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container appearance-none transition-colors" id="stop-selector">
<option value="kiu">KIU Main Gate</option>
<option value="kutaisi">Kutaisi Central</option>
<option value="terjola">Terjola</option>
<option value="samtredia">Samtredia</option>
<option value="khoni">Khoni</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
</div>

<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-sm rounded-lg flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined" data-icon="search">search</span>
                Check Status
            </button>
<div class="mt-md text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-base">
<span class="material-symbols-outlined text-[16px]" data-icon="schedule">schedule</span>
                     Next bus typically arrives in 15 mins.
                 </p>
</div>
</div>
<!-- Quick Status Cards (Bento Style) -->
<div class="w-full max-w-md mt-xl grid grid-cols-2 gap-md">
<div class="bg-surface-container border border-outline-variant rounded-lg p-sm flex flex-col justify-between h-24">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="directions_bus">directions_bus</span>

<div class="font-headline-lg text-headline-lg text-primary-container">4</div>
</div>
<div class="bg-surface-container border border-outline-variant rounded-lg p-sm flex flex-col justify-between h-24">

<span class="font-['Lexend'] text-[12px] font-semibold uppercase tracking-wider mt-1">Home</span>
</button>
<!-- Inactive Tab: Live Map -->
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-3 py-1 hover:text-blue-600 dark:hover:text-blue-400 active:scale-95 transition-transform duration-150 w-1/4">
<span class="material-symbols-outlined" data-icon="directions_bus">directions_bus</span>
<span class="font-['Lexend'] text-[12px] font-semibold uppercase tracking-wider mt-1">Live Map</span>
</button>

<span class="font-['Lexend'] text-[12px] font-semibold uppercase tracking-wider mt-1">Routes</span>
</button>

<button class="font-label-bold text-label-bold text-slate-500 hover:text-primary-container uppercase tracking-wider transition-colors pb-1">Live Map</button>
<button class="font-label-bold text-label-bold text-slate-500 hover:text-primary-container uppercase tracking-wider transition-colors pb-1">Routes</button>
