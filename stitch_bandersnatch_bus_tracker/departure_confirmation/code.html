        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md text-body-md h-[884px] w-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary">
<!-- 
        NOTE: Navigation Shell (TopAppBar & BottomNavBar) is explicitly suppressed here.
        Reason: This is a linear/transactional "Confirmation" splash screen. 
        As per the "Shell Visibility & Relevance" mandate, navigation is hidden to prioritize the focused canvas.
    -->
<main class="flex-1 flex flex-col items-center justify-center p-container-padding w-full max-w-md mx-auto">
<!-- Focused Content Container -->
<div class="flex flex-col items-center text-center w-full">
<!-- Contextual Icon (Timer/Schedule) -->
<div class="w-24 h-24 mb-lg rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                    timer
                </span>
</div>
<!-- Large Clear Headline -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xl">
                Leave in 10 minutes?
            </h1>
<!-- Prominent Primary Action -->
<button class="w-full min-h-[48px] bg-primary-container text-on-primary rounded-lg font-label-bold text-label-bold flex items-center justify-center transition-all active:scale-95 mb-md shadow-sm">
                Yes, I'm leaving now
            </button>
<!-- Subtle Secondary/Cancel Action (Ergonomic out) -->
<button class="min-h-[48px] px-lg font-label-sm text-label-sm text-on-surface-variant rounded-full flex items-center justify-center transition-colors active:bg-surface-container-highest">
                Not yet
            </button>
</div>
</main>
